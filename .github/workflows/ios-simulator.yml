name: iPad Simulator Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run ios:sync
      - name: Start iPad Simulator
        id: ipad
        timeout-minutes: 3
        run: |
          device=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          runtimes = json.load(sys.stdin)["devices"]
          devices = [d for runtime, group in runtimes.items() if ".iOS-" in runtime for d in group]
          ipads = [d for d in devices if d["name"].startswith("iPad") and d["state"] == "Shutdown"]
          print(min(ipads, key=lambda d: (not d["name"].startswith("iPad mini"), d["name"]))["udid"])
          ')
          echo "id=$device" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$device"
      - name: Build for iPad Simulator
        run: >-
          xcodebuild -project ios/App/App.xcodeproj -scheme App
          -configuration Debug -destination 'generic/platform=iOS Simulator'
          -derivedDataPath "$RUNNER_TEMP/score-record-build"
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Wait for iPad Simulator
        timeout-minutes: 5
        env:
          IPAD_DEVICE: ${{ steps.ipad.outputs.id }}
        run: xcrun simctl bootstatus "$IPAD_DEVICE" -b
      - name: Install and launch on iPad Simulator
        timeout-minutes: 4
        env:
          IPAD_DEVICE: ${{ steps.ipad.outputs.id }}
        run: |
          xcrun simctl install "$IPAD_DEVICE" "$RUNNER_TEMP/score-record-build/Build/Products/Debug-iphonesimulator/App.app"
          xcrun simctl launch "$IPAD_DEVICE" app.scorerecord.tracker
          sleep 3
      - name: Capture iPad screenshot
        timeout-minutes: 2
        env:
          IPAD_DEVICE: ${{ steps.ipad.outputs.id }}
        run: xcrun simctl io "$IPAD_DEVICE" screenshot "$RUNNER_TEMP/score-record-ipad.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: score-record-ipad-simulator
          path: ${{ runner.temp }}/score-record-ipad.png
          if-no-files-found: error
          retention-days: 7
